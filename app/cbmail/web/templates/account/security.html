{% extends "base_sneat.html" %}
{% block title %}Безопасность{% endblock %}
{% block content %}
<div class="col-12 col-lg-7">
  <h5 class="mb-4">Безопасность</h5>
  <div class="card shadow-sm">
    <div class="card-header"><h6 class="mb-0">Смена пароля</h6></div>
    <div class="card-body">
      <form method="post" action="/account/security">
        {{ csrf_input(request)|safe }}
        <div class="mb-3"><label class="form-label" for="s_cur">Текущий пароль</label><input type="password" id="s_cur" name="current_password" class="form-control" autocomplete="current-password" required></div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="s_new">Новый пароль</label><input type="password" id="s_new" name="new_password" class="form-control" autocomplete="new-password" required></div>
          <div class="col-md-6"><label class="form-label" for="s_conf">Повторите новый пароль</label><input type="password" id="s_conf" name="confirm_password" class="form-control" autocomplete="new-password" required></div>
        </div>
        <div class="form-text mt-2">Минимум 6 символов. После смены пароля потребуется войти заново.</div>
        <div class="mt-4"><button class="btn btn-primary" type="submit">Сменить пароль</button></div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
